<!-- @dsCard group="Colors" name="Product Gradients" subtitle="Sunset = product master. Mist & Meadow are legacy promo — use Marketing Gradients for new work" viewport="700x230" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Brand Gradients</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="col" style="gap: 12px;">
  <div class="row">
    <div class="tile on-color" style="background: linear-gradient(50deg, #FF761A 0%, #FF7D36 13%, #FFABE7 100%); height: 78px; flex: 2;">
      <div class="name">Sunset <span style="font-size: 9px; background: rgba(255,255,255,0.25); padding: 2px 6px; border-radius: 9999px; margin-left: 4px;">MASTER</span></div>
      <div class="hex">#FF761A → #FFABE7 · SaaS UI</div>
    </div>
    <div class="tile on-color" style="background: linear-gradient(50deg, #5DDBC8 0%, #C5A4D9 50%, #F4A6D0 100%); height: 78px;">
      <div class="name">Mist</div>
      <div class="hex">legacy · use Blush</div>
    </div>
  </div>
  <div class="row">
    <div class="tile on-color" style="background: linear-gradient(50deg, #FEE516 0%, #FCE518 32%, #F4E51F 47%, #E8E52B 58%, #D5E53C 67%, #BEE553 75%, #A1E56E 83%, #7EE48F 89%, #57E4B4 96%, #37E4D2 100%); height: 78px; flex: 1;">
      <div class="name">Meadow</div>
      <div class="hex">legacy · use Meadow field</div>
    </div>
  </div>
  <div class="between" style="margin-top: 2px;">
    <span class="cap">Product · 50° fixed</span>
    <span class="mono">Sunset = sidebar + CTA only</span>
  </div>
</div>
</body></html>
