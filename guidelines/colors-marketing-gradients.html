<!-- @dsCard group="Colors" name="Marketing Gradients" subtitle="Fields (full-bleed) and fills (shapes only) — marketing & documents, never product UI" viewport="700x210" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Marketing Gradients</title>
<link rel="stylesheet" href="_card.css">
<style>.g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.g2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}.s{border-radius:10px;height:70px;padding:10px 12px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end}.n{font-size:12px;font-weight:800;color:#474242}.h{font-family:var(--font-mono);font-size:9.5px;color:#474242;opacity:.8}.w .n,.w .h{color:#fff}.s2{height:52px}</style>
</head><body>
<div class="cap" style="margin-bottom:8px">Fields · full-bleed backgrounds</div>
<div class="g">
<div class="s" style="background:var(--gradient-blush)"><div class="n">Blush field</div><div class="h">#FFABE7 → #3BE3D2</div></div>
<div class="s" style="background:var(--gradient-meadow-field)"><div class="n">Meadow field</div><div class="h">#3BE3D2 → #FFDB2E</div></div>
<div class="s" style="background:var(--gradient-corner-field)"><div class="n">Corner field</div><div class="h">#3BE3D2 + #FF5A0A glow</div></div>
</div>
<div class="g2">
<div class="s s2 w" style="background:var(--gradient-sunset-flat)"><div class="n">Sunset flat</div></div>
<div class="s s2 w" style="background:var(--gradient-grape)"><div class="n">Grape</div></div>
<div class="s s2" style="background:linear-gradient(40deg,#FFABE7,#E9B0E6 40%,#AFC3E0 70%,#3BE3D2)"><div class="n">Blush fill</div></div>
<div class="s s2" style="background:linear-gradient(210deg,#FDE51A,#C2E64E 55%,#37E4D2)"><div class="n">Meadow sweep</div></div>
</div>
</body></html>
