<!-- @dsCard group="Colors" name="Text Colors" subtitle="Plum-gray primary, never pure black" viewport="700x220" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Text Colors</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="col" style="gap: 10px;">
  <div class="between">
    <div style="color: #5E555A; font: 600 16px var(--font-sans);">Primary text — Aa</div>
    <div class="mono">#5E555A · plum-gray · never #000</div>
  </div>
  <div class="between">
    <div style="color: #7F8C8D; font: 500 16px var(--font-sans);">Secondary — metadata</div>
    <div class="mono">#7F8C8D</div>
  </div>
  <div class="between">
    <div style="color: #BDC3C7; font: 400 16px var(--font-sans);">Disabled placeholder</div>
    <div class="mono">#BDC3C7</div>
  </div>
  <div class="between">
    <div style="color: #F7607A; font: 500 16px var(--font-sans);">Link / focus accent</div>
    <div class="mono">#F7607A</div>
  </div>
  <div class="between" style="background: linear-gradient(50deg, #FF761A 0%, #FFABE7 100%); border-radius: 8px; padding: 8px 12px;">
    <div style="color: #FFFFFF; font: 600 16px var(--font-sans);">On gradient — white</div>
    <div class="mono" style="color: rgba(255,255,255,0.85);">#FFFFFF</div>
  </div>
</div>
</body></html>
