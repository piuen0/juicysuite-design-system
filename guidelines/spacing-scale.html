<!-- @dsCard group="Spacing" name="Spacing Scale" subtitle="4px base, 4 → 64 with named structural roles" viewport="700x280" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing Scale</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="col" style="gap: 6px;">
  <div class="cap">4px base unit · cards never touch</div>
  <div class="row" style="gap: 10px;"><div class="mono" style="width: 84px;">--sp-1</div><div style="height: 14px; width: 4px;   background: var(--gradient-sunset); border-radius: 2px;"></div><div class="mono">4</div></div>
  <div class="row" style="gap: 10px;"><div class="mono" style="width: 84px;">--sp-2</div><div style="height: 14px; width: 8px;   background: var(--gradient-sunset); border-radius: 2px;"></div><div class="mono">8</div></div>
  <div class="row" style="gap: 10px;"><div class="mono" style="width: 84px;">--sp-3</div><div style="height: 14px; width: 12px;  background: var(--gradient-sunset); border-radius: 2px;"></div><div class="mono">12</div></div>
  <div class="row" style="gap: 10px;"><div class="mono" style="width: 84px;">--sp-4 · gap</div><div style="height: 14px; width: 16px;  background: var(--gradient-sunset); border-radius: 2px;"></div><div class="mono">16 — card children</div></div>
  <div class="row" style="gap: 10px;"><div class="mono" style="width: 84px;">--sp-5</div><div style="height: 14px; width: 20px;  background: var(--gradient-sunset); border-radius: 2px;"></div><div class="mono">20</div></div>
  <div class="row" style="gap: 10px;"><div class="mono" style="width: 84px;">--sp-6 · section</div><div style="height: 14px; width: 24px;  background: var(--gradient-sunset); border-radius: 2px;"></div><div class="mono">24 — section + card pad</div></div>
  <div class="row" style="gap: 10px;"><div class="mono" style="width: 84px;">--sp-8</div><div style="height: 14px; width: 32px;  background: var(--gradient-sunset); border-radius: 2px;"></div><div class="mono">32 — page padding</div></div>
  <div class="row" style="gap: 10px;"><div class="mono" style="width: 84px;">--sp-10</div><div style="height: 14px; width: 40px;  background: var(--gradient-sunset); border-radius: 2px;"></div><div class="mono">40</div></div>
  <div class="row" style="gap: 10px;"><div class="mono" style="width: 84px;">--sp-12</div><div style="height: 14px; width: 48px;  background: var(--gradient-sunset); border-radius: 2px;"></div><div class="mono">48</div></div>
  <div class="row" style="gap: 10px;"><div class="mono" style="width: 84px;">--sp-16</div><div style="height: 14px; width: 64px;  background: var(--gradient-sunset); border-radius: 2px;"></div><div class="mono">64 — page padding max</div></div>
</div>
</body></html>
