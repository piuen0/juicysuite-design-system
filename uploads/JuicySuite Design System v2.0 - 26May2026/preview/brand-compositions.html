<!doctype html>
<!-- @dsCard group="Brand" name="Composition Patterns" subtitle="Solo · Duo (TR↔BL diagonal) · Stack (true edge-to-edge tangent)" viewport="700x320" --><html><head><meta charset="utf-8"><title>Compositions</title>
<link rel="stylesheet" href="_card.css">
<style>
  /* All three thumbnails use the brand-spec 1:√2 canvas. */
  .frame {
    flex: 1;
    aspect-ratio: 1 / 1.414;
    border-radius: 10px;
    position: relative;
    overflow: hidden;
  }
  .frame .lbl {
    font-family: var(--font-mono);
    font-weight: 700;
    color: var(--text-primary);
    margin-top: 6px;
    text-align: center;
    font-size: 11px;
  }
</style>
</head><body>
<svg width="0" height="0" style="position: absolute;" aria-hidden="true">
  <defs>
    <linearGradient id="sg2" x1="0.117" y1="0.821" x2="0.883" y2="0.179">
      <stop offset="0%" stop-color="#FF761A"/>
      <stop offset="13%" stop-color="#FF7D36"/>
      <stop offset="100%" stop-color="#FFABE7"/>
    </linearGradient>
  </defs>
</svg>

<div class="col" style="gap: 8px;">
  <div class="cap" style="color: var(--accent-primary);">Solo · Duo · Stack — three composition patterns</div>

  <div class="row" style="gap: 12px; align-items: flex-start;">

    <!-- SOLO — one Stone · Round, centered on calm canvas -->
    <div style="flex: 1;">
      <div class="frame" style="background: #F7F8FC; display: flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 100 100" style="width: 70%;">
          <path d="M 50 4 C 70 4 95 22 96 48 C 97 72 78 96 52 96 C 28 96 4 78 5 52 C 6 26 28 4 50 4 Z" fill="url(#sg2)"/>
        </svg>
      </div>
      <div class="lbl">Solo</div>
    </div>

    <!-- DUO — TR↔BL, √2:1 ratio, two gradients (warm bg/cool focal) -->
    <div style="flex: 1;">
      <div class="frame" style="background: #F7F8FC;">
        <!-- Large Citrus TR (55%) -->
        <div style="position: absolute; top: -8%; right: -8%; width: 55%; aspect-ratio: 1; border-radius: 50%;
                    background: linear-gradient(50deg, #F5D840 0%, #3DD2A4 100%);
                    box-shadow: 0 8px 18px rgba(0,0,0,0.12);"></div>
        <!-- Small Mist BL (39% — that's 55/√2) -->
        <div style="position: absolute; bottom: -5%; left: -5%; width: 39%; aspect-ratio: 1; border-radius: 50%;
                    background: linear-gradient(50deg, #5DDBC8 0%, #C5A4D9 50%, #F4A6D0 100%);
                    box-shadow: 0 8px 18px rgba(0,0,0,0.12);"></div>
      </div>
      <div class="lbl">Duo · TR↔BL · √2:1</div>
    </div>

    <!-- STACK — three Marbles, EDGE-TO-EDGE tangent along the vertical centre axis.
         Canvas aspect 1:√2. Marble width 70.7% of canvas_w → marble height = 70.7%/√2 = 50% canvas_h.
         Centres at top = 0%, 50%, 100% of canvas_h → spacing = 50% canvas_h = marble diameter ⇒ true tangent.
         Top and bottom marbles crop at the canvas edges; middle marble fully visible. -->
    <div style="flex: 1;">
      <div class="frame" style="background: #20CC76;">
        <div style="position: absolute; left: 50%; top:   0%; transform: translate(-50%, -50%); width: 70.7%; aspect-ratio: 1; border-radius: 50%;
                    background: linear-gradient(50deg, #43E3D2 0%, #FDADE6 100%);"></div>
        <div style="position: absolute; left: 50%; top:  50%; transform: translate(-50%, -50%); width: 70.7%; aspect-ratio: 1; border-radius: 50%;
                    background: linear-gradient(50deg, #43E3D2 0%, #FDADE6 100%);"></div>
        <div style="position: absolute; left: 50%; top: 100%; transform: translate(-50%, -50%); width: 70.7%; aspect-ratio: 1; border-radius: 50%;
                    background: linear-gradient(50deg, #43E3D2 0%, #FDADE6 100%);"></div>
      </div>
      <div class="lbl">Stack · tangent (edge-to-edge)</div>
    </div>

  </div>
</div>
</body></html>
