<!doctype html>
<!-- @dsCard group="Brand" name="50° Gradient Angle" subtitle="Fixed angle across all brand gradients" viewport="700x220" --><html><head><meta charset="utf-8"><title>Gradient Angle</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="row" style="gap: 18px; align-items: center;">
  <div style="position: relative; width: 180px; height: 180px; flex-shrink: 0;">
    <!-- The Sunset swatch -->
    <div style="position: absolute; inset: 0; border-radius: 16px;
                background: linear-gradient(50deg, #FF761A 0%, #FF7D36 13%, #FFABE7 100%);
                box-shadow: 0 4px 12px rgba(255,118,26,0.3);"></div>

    <!-- Direction indicator — arrow now reversed: points from TOP-RIGHT down to BOTTOM-LEFT -->
    <svg style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;" viewBox="0 0 100 100">
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#fff"/>
        </marker>
      </defs>
      <!-- Line from top-right (start) to bottom-left (arrowhead) -->
      <line x1="86" y1="14" x2="14" y2="86"
            stroke="#fff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.95"
            marker-end="url(#ah)" />
      <!-- Origin dot at the tail (TR) -->
      <circle cx="86" cy="14" r="3" fill="#fff" />
      <!-- 50° label sitting in the wedge near the TR origin -->
      <text x="72" y="26" fill="#fff"
            font-family="JetBrains Mono, monospace" font-size="9" font-weight="700"
            text-anchor="end">50°</text>
    </svg>
  </div>

  <div class="col" style="gap: 6px;">
    <div class="t-section" style="font-size: 22px;">50° fixed</div>
    <div class="mono">All 4 brand gradients render at exactly 50°.</div>
    <div class="mono">Never tilt. Never rotate.<br/>The angle IS the brand.</div>
    <div class="mono" style="margin-top: 6px; padding: 6px 10px; background: var(--surface-input); border-radius: 6px;">linear-gradient(<strong style="color: var(--accent-primary);">50deg</strong>, …)</div>
  </div>
</div>
</body></html>
