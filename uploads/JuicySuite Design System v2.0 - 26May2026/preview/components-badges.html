<!doctype html>
<!-- @dsCard group="Brand" name="Status Badges & Trends" subtitle="Pill badges + ▲▼ trend arrows" viewport="700x130" --><html><head><meta charset="utf-8"><title>Badges</title>
<link rel="stylesheet" href="_card.css">
<style>
.badge { height: 26px; border-radius: 9999px; padding: 0 12px; font: 600 12px var(--font-sans); display: inline-flex; align-items: center; line-height: 1; }
</style></head><body>
<div class="col" style="gap: 12px;">
  <div class="row" style="gap: 8px;">
    <span class="badge" style="background: #E8F8E8; color: #00CE73;">Activated</span>
    <span class="badge" style="background: #FDE8E8; color: #FF5C4C;">Unactivated</span>
    <span class="badge" style="background: #FFF3E0; color: #B58400;">Paused</span>

    <span class="badge" style="background: #F0F2F7; color: #7F8C8D;">Draft</span>
  </div>
  <div class="row" style="gap: 24px; padding-top: 4px;">
    <div class="row" style="gap: 6px;"><span class="t-stat" style="font-size: 20px;">8.1%</span><span style="font: 600 11px var(--font-sans); color: #00CE73;">▲ 12.4%</span></div>
    <div class="row" style="gap: 6px;"><span class="t-stat" style="font-size: 20px;">2.4%</span><span style="font: 600 11px var(--font-sans); color: #FF5C4C;">▼ 2.1%</span></div>

  </div>
</div>
</body></html>
