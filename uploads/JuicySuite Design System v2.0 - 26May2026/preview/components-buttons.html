<!doctype html>
<!-- @dsCard group="Brand" name="Buttons" subtitle="Primary gradient · secondary outline · text · destructive" viewport="700x140" --><html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_card.css">
<style>
.btn { height: 40px; border-radius: 9999px; font: 600 14px var(--font-sans); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 0 24px; border: none; }
.btn-primary { background: var(--gradient-sunset); color: #fff; box-shadow: 0 4px 12px rgba(255,118,26,0.3); }
.btn-secondary { background: transparent; color: var(--text-primary); border: 1px solid var(--border-default); font-weight: 500; padding: 0 20px; }
.btn-text { background: none; color: var(--text-link); font: 500 13px var(--font-sans); cursor: pointer; padding: 0; height: auto; border: none; display: inline-flex; gap: 6px; align-items: center; }
.btn-destructive { background: none; color: #FF5C4C; font: 500 13px var(--font-sans); padding: 0; border: none; cursor: pointer; }
</style></head><body>
<div class="col" style="gap: 12px;">
  <div class="row">
    <button class="btn btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Campaign
    </button>
    <button class="btn btn-secondary">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
      Filter
    </button>
    <button class="btn btn-primary" style="height: 32px; padding: 0 16px; font-size: 13px;">Save</button>
  </div>
  <div class="row">
    <button class="btn-text">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Edit
    </button>
    <button class="btn-text">Show More →</button>
    <button class="btn-destructive">Remove Card</button>
  </div>
</div>
</body></html>
