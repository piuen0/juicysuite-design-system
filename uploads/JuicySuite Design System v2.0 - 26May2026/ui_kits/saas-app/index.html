<!doctype html>
<!-- @dsCard group="UI Kit — Saas App" name="JuicySuite SaaS App" subtitle="Clickable operator console — Dashboard · Members · Earning" viewport="1440x900" -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JuicySuite — Operator Console</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <style>
    html, body { margin: 0; min-height: 100vh; background: var(--surface-page); }
    #root { display: flex; min-height: 100vh; }
    /* Hide ugly scrollbars in sidebar */
    aside::-webkit-scrollbar { width: 6px; }
    aside::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 9999px; }
    /* Smooth focus ring kill in favor of coral border */
    button:focus, input:focus { outline: none; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="cards.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>

  <script type="text/babel">
    const { useState } = React;
    const { JSSidebar, JSTopHeader, JSButton, JSIcon } = window;

    const screenMeta = {
      dashboard: { title: "Dashboard",         subtitle: "Your loyalty program at a glance — May 26, 2026",
                   actions: <JSButton variant="primary" icon="plus">Add Campaign</JSButton>, Comp: window.DashboardScreen },
      members:   { title: "Members",           subtitle: "12,438 active members across 4 tiers",
                   actions: <JSButton variant="primary" icon="plus">New member</JSButton>, Comp: window.MembersScreen },
      earning:   { title: "Earning",           subtitle: "Campaigns and rules that award points",
                   actions: null, Comp: window.EarningScreen },
      rewards:   { title: "Rewards",           subtitle: "Catalog members can redeem with their points",
                   actions: null, Comp: window.RewardsScreen },
      reports:   { title: "Reports",           subtitle: "Lifetime value, redemption mix, and campaign ROI",
                   actions: null, Comp: window.ReportsScreen },
      billing:   { title: "Billing",           subtitle: "Plan, usage and invoices",
                   actions: null, Comp: window.BillingScreen },
      settings:  { title: "Workspace settings",subtitle: "Team, integrations and notifications",
                   actions: null, Comp: window.SettingsScreen },
    };

    const App = () => {
      const [active, setActive] = useState("dashboard");
      const meta = screenMeta[active];
      const Screen = meta.Comp;
      return (
        <React.Fragment>
          <JSSidebar active={active} onNav={setActive} />
          <main style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column" }}>
            <JSTopHeader title={meta.title} subtitle={meta.subtitle} actions={meta.actions} />
            <div style={{ flex: 1, minHeight: 0 }}>
              <Screen />
            </div>
          </main>
        </React.Fragment>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
